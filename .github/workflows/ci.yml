name: Checkup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_local_only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: ehtech
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_local_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci_local_only
      DB_DATABASE: ehtech
      DB_SSL: "false"
      COMPAT_AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run db:init
      - run: npm run check
      - run: npm run test:integration
