# Banco exclusivo para desenvolvimento. Porta 3307 evita disputar o MySQL local.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ehtech
      MYSQL_USER: ehtech
      MYSQL_PASSWORD: ehtech_local
      MYSQL_ROOT_PASSWORD: ehtech_root_local
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
